<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv = "X-UA-Compatible" content = "IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link 
       href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"  
       rel = "stylesheet"
    />
</head>



<body>

      <div class ="container">
        <h2>Form Demo</h2>
        <form> 

            <div class="row">
                <div class ="mb-3 col-md-6">
                    <label class ="from-label" for ="email">Email</label>
                    <input type = "text" class = "form-control" placeholder ="Email" id ="email"/>
                </div>

                <div class ="mb-3 col-md-6">
                    <label class ="from-label" for ="password">Password</label>
                    <input type = "password" class = "form-control" placeholder ="password" id ="password"/>
                </div>
            </div>

            <div class ="mb-3">
                <label class ="from-label" for ="address">Aaddress</label>
                <input type = "text" class = "form-control-sm" placeholder ="address" id ="address"/>
            </div>
           
             <div class ="mb-3">
                <select class ="from-select">
                    <option selected>select something</option>
                    <option value = "1">one</option>
                    <option value = "2">two</option>
                    <option value = "3">three</option>

                </select>
            </div>

            <div class ="normal mb-3">
                <input type="checkbox" id ="agree" />
                <label for ="agree">Agree</label>
            </div>


            <div class ="mb-3 form-check">
                <input type="checkbox" id ="agreebs" class="form-check-input"/>
                <label for ="agreebs" class ="form-check-label">Agree</label>
            </div>
            

            <div class ="mb-3 form-check">
                <input type="radio" id ="radio" class="form-check-input"/>
                <label for ="radio" class ="form-check-label">Yes/No</label>
            </div>

            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>

        </form>
      </div>
    <script> src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" </script>

</body>
</html>
